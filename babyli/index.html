<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#b03a6f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="BabyLi">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<script src="receitas.js"></script>
<script src="ilustra.js"></script>
<!--APP-START-->
<title>BabyLi Papinha</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: app de celular em uma coluna, navegação fixa embaixo; a fase atual da bebê abre o app */
:root {
  --bg: #f7f4fb;
  --surface: #ffffff;
  --ink: #2b2540;
  --muted: #696283;
  --line: #e7e1f0;
  --beet: #b03a6f;
  --beet-soft: #f8e4ee;
  --pumpkin: #d97c1e;
  --pumpkin-soft: #fdeedd;
  --ok: #2c8556;
  --ok-soft: #e0f2e7;
  --warn: #a96a0c;
  --warn-soft: #fbf0d8;
  --no: #c23a3a;
  --no-soft: #fbe3e1;
  --display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --body: "Nunito", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17141f; --surface: #221d2d; --ink: #f0ebf7; --muted: #aaa2c0; --line: #352e44;
    --beet: #ec85b0; --beet-soft: #3d2032; --pumpkin: #f1a65a; --pumpkin-soft: #3a2a19;
    --ok: #6fcf98; --ok-soft: #1c3427; --warn: #e7b65a; --warn-soft: #3a2f17; --no: #f08b85; --no-soft: #3e1f1f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17141f; --surface: #221d2d; --ink: #f0ebf7; --muted: #aaa2c0; --line: #352e44;
  --beet: #ec85b0; --beet-soft: #3d2032; --pumpkin: #f1a65a; --pumpkin-soft: #3a2a19;
  --ok: #6fcf98; --ok-soft: #1c3427; --warn: #e7b65a; --warn-soft: #3a2f17; --no: #f08b85; --no-soft: #3e1f1f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); }
body { margin: 0; color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--beet); outline-offset: 2px; border-radius: 8px; }
h1, h2, h3 { font-family: var(--display); font-weight: 600; line-height: 1.2; text-wrap: balance; margin: 0; }
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 112px; }

/* topo */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px 10px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand svg { flex: none; }
.brand div { white-space: nowrap; }
.brand b { font-family: var(--display); font-size: 1.35rem; font-weight: 700; color: var(--beet); letter-spacing: -0.01em; }
.brand span { font-family: var(--display); font-weight: 500; color: var(--pumpkin); font-size: 1.35rem; }
.agebtn { min-width: 0; max-width: 55%; overflow: hidden; text-overflow: ellipsis; display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-weight: 800; font-size: .9rem; white-space: nowrap; }
.agebtn span { overflow: hidden; text-overflow: ellipsis; }
.agebtn svg { flex: none;  width: 14px; height: 14px; }

/* navegação */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.nav div { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(6, 1fr); }
.nav button { border: 0; background: none; padding: 8px 0 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: .7rem; font-weight: 800; color: var(--muted); }
.nav button svg { width: 24px; height: 24px; }
.nav button[aria-current="page"] { color: var(--beet); }

section.view { display: grid; gap: 20px; padding-top: 6px; }
.eyebrow { font-size: .75rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.lead { color: var(--muted); margin: 0; }
.muted { color: var(--muted); }

/* fase atual */
.hero { background: var(--beet-soft); border-radius: 24px; padding: 20px; display: grid; gap: 14px; }
.hero h1 { font-size: 1.7rem; }
.hero h1 em { font-style: normal; color: var(--beet); }
.facts { display: grid; gap: 10px; }
.fact { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; }
.fact .ic { width: 30px; height: 30px; border-radius: 10px; background: var(--surface); display: grid; place-items: center; color: var(--beet); }
.fact .ic svg { width: 18px; height: 18px; }
.fact b { display: block; font-size: .8rem; color: var(--muted); font-weight: 800; text-transform: uppercase; letter-spacing: .05em; }
.fact p { margin: 0; }

.block { display: grid; gap: 10px; }
.block > header { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.block h2 { font-size: 1.25rem; }
.link { border: 0; background: none; color: var(--beet); font-weight: 800; padding: 4px 0; font-size: .9rem; white-space: nowrap; }

.rules { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.rule { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px; display: grid; gap: 4px; }
.rule b { font-family: var(--display); font-weight: 600; font-size: 1.05rem; }
.rule small { color: var(--muted); font-size: .82rem; line-height: 1.35; }
.rule .tag { justify-self: start; }

.routine { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.routine li { display: grid; grid-template-columns: 62px 1fr; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--line); }
.routine li:first-child { border-top: 0; }
.routine time { font-weight: 800; color: var(--beet); font-variant-numeric: tabular-nums; }

.scroller { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 4px; margin-inline: -4px; padding-inline: 4px; scrollbar-width: none; }
.scroller::-webkit-scrollbar { display: none; }
.mini { flex: 0 0 200px; scroll-snap-align: start; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 18px; padding: 14px; display: grid; gap: 6px; align-content: start; }
.mini b { font-family: var(--display); font-weight: 600; font-size: 1.02rem; line-height: 1.25; }

.news { margin: 0; padding-left: 20px; display: grid; gap: 4px; }

/* chips e busca */
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; margin-inline: -4px; padding-inline: 4px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 13px; font-weight: 700; font-size: .88rem; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.chip.phase[aria-pressed="true"] { background: var(--beet); border-color: var(--beet); color: #fff; }
.chip .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--pumpkin); margin-left: 6px; vertical-align: middle; }
.search { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 0 12px; }
.search svg { width: 18px; height: 18px; color: var(--muted); flex: none; }
.search input { border: 0; background: none; padding: 11px 0; width: 100%; outline: none; }
.filters { display: grid; gap: 10px; }

/* lista de receitas */
.list { display: grid; gap: 10px; }
.rcard { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 18px; padding: 14px; display: grid; grid-template-columns: 46px 1fr auto; gap: 12px; align-items: center; width: 100%; }
.rcard .emo { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; }
.rcard { grid-template-columns: 72px 1fr auto; }
.thumb { width: 72px; height: 56px; border-radius: 14px; overflow: hidden; display: block; background: var(--bg); }
.thumb svg, .thumb img { width: 100%; height: 100%; display: block; object-fit: cover; }
.mini .thumb { width: 100%; height: 104px; }
.recimg { margin: 0; border-radius: 22px; overflow: hidden; aspect-ratio: 4 / 3; max-width: 100%; background: var(--bg); position: relative; }
.recimg svg, .recimg img { width: 100%; height: 100%; display: block; object-fit: cover; }
.imgbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; font-size: .82rem; color: var(--muted); }
.cuts { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.cut { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; display: grid; }
.cut svg { width: 100%; height: auto; display: block; background: var(--bg); aspect-ratio: 4 / 3; }
.cut figcaption { padding: 10px 12px 12px; display: grid; gap: 3px; font-size: .86rem; line-height: 1.35; }
.cut figcaption b { font-size: .92rem; }
.cut figcaption span { color: var(--muted); }
.cut.novo { border-color: var(--beet); }
.rcard .emo svg { width: 24px; height: 24px; }
.rcard b { font-family: var(--display); font-weight: 600; font-size: 1.05rem; line-height: 1.25; display: block; }
.rcard small { color: var(--muted); font-size: .84rem; }
.rcard .heart { width: 20px; height: 20px; color: var(--beet); }
.empty { text-align: center; color: var(--muted); padding: 30px 10px; background: var(--surface); border: 1px dashed var(--line); border-radius: 18px; }

.t-almoco { background: var(--pumpkin-soft); color: var(--pumpkin); }
.t-cafe { background: var(--warn-soft); color: var(--warn); }
.t-lanche { background: var(--ok-soft); color: var(--ok); }
.t-fruta { background: var(--beet-soft); color: var(--beet); }
.t-bebida { background: color-mix(in srgb, var(--ok) 12%, var(--surface)); color: var(--ok); }
.t-sobremesa { background: var(--beet-soft); color: var(--beet); }

.tag { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 2px 9px; font-size: .74rem; font-weight: 800; white-space: nowrap; }
.tag.ok { background: var(--ok-soft); color: var(--ok); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.tag.no { background: var(--no-soft); color: var(--no); }
.tag.age { background: var(--beet-soft); color: var(--beet); }

/* pode ou não pode */
.agebar { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px; }
.agebar label { font-weight: 800; font-size: .9rem; }
.agebar select { border: 1.5px solid var(--line); background: var(--bg); border-radius: 10px; padding: 6px 8px; font-weight: 700; }
.legend { display: flex; gap: 8px; flex-wrap: wrap; }
.food { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.food > button { width: 100%; border: 0; background: none; text-align: left; padding: 12px 14px; display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
.food .fname { font-weight: 800; }
.food .fname small { display: block; font-weight: 600; color: var(--muted); font-size: .8rem; }
.food .more { padding: 0 14px 14px; display: grid; gap: 8px; font-size: .94rem; }
.food .more p { margin: 0; }
.tried { justify-self: start; display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--line); background: var(--bg); border-radius: 999px; padding: 5px 12px; font-weight: 800; font-size: .84rem; }
.tried[aria-pressed="true"] { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.grouph { font-family: var(--display); font-weight: 600; font-size: 1.05rem; margin-top: 6px; }
.choke { color: var(--no); font-weight: 800; font-size: .84rem; }

/* fases */
.phase { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.phase.current { border-color: var(--beet); box-shadow: 0 0 0 1px var(--beet); }
.phase > button { width: 100%; border: 0; background: none; text-align: left; padding: 14px; display: grid; grid-template-columns: 54px 1fr auto; gap: 12px; align-items: center; }
.phase .age { width: 54px; height: 54px; border-radius: 16px; background: var(--beet-soft); color: var(--beet); display: grid; place-items: center; text-align: center; font-family: var(--display); font-weight: 700; line-height: 1; font-size: 1.25rem; }
.phase .age small { display: block; font-size: .62rem; font-family: var(--body); font-weight: 800; text-transform: uppercase; }
.phase h3 { font-size: 1.08rem; }
.phase .body { padding: 0 14px 16px; display: grid; gap: 12px; }
.chev { width: 20px; height: 20px; color: var(--muted); transition: transform .2s; }
[aria-expanded="true"] .chev { transform: rotate(180deg); }

/* detalhe da receita */
.sheet { position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto; overscroll-behavior: contain; }
.sheet .wrap { padding-block: 0 40px; }
.sheet .top { padding-block: 12px 10px; }
.iconbtn { width: 42px; height: 42px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); display: grid; place-items: center; flex: none; }
.iconbtn svg { width: 20px; height: 20px; }
.iconbtn.on { color: var(--beet); border-color: var(--beet); background: var(--beet-soft); }
.rhead { display: grid; gap: 10px; }
.rhead h1 { font-size: 1.75rem; }
.meta { display: flex; gap: 8px; flex-wrap: wrap; }
.meta span { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; font-size: .84rem; font-weight: 700; }
.warnbox { background: var(--no-soft); color: var(--no); border-radius: 14px; padding: 10px 14px; font-weight: 700; font-size: .92rem; }
.ings { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; }
.ings li { border-top: 1px solid var(--line); }
.ings li:first-child { border-top: 0; }
.ings label { display: flex; gap: 12px; align-items: flex-start; padding: 11px 14px; cursor: pointer; }
.ings input { width: 20px; height: 20px; accent-color: var(--beet); margin: 2px 0 0; flex: none; }
.ings input:checked + span { text-decoration: line-through; color: var(--muted); }
.steps { margin: 0; padding: 0; list-style: none; counter-reset: s; display: grid; gap: 12px; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 32px 1fr; gap: 12px; }
.steps li::before { content: counter(s); width: 32px; height: 32px; border-radius: 50%; background: var(--beet); color: #fff; font-family: var(--display); font-weight: 600; display: grid; place-items: center; }
.tip { background: var(--pumpkin-soft); border-radius: 16px; padding: 12px 14px; }
.tip b { color: var(--pumpkin); }

/* perfil */
.modal { position: fixed; inset: 0; z-index: 30; background: color-mix(in srgb, #000 45%, transparent); display: grid; align-items: end; }
.modal .card { background: var(--surface); border-radius: 24px 24px 0 0; max-width: 640px; width: 100%; margin: 0 auto; padding: 20px max(16px, env(safe-area-inset-left, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; }
.field { display: grid; gap: 6px; }
.field label { font-weight: 800; font-size: .9rem; }
.field input, .field select { border: 1.5px solid var(--line); background: var(--bg); border-radius: 12px; padding: 11px 12px; width: 100%; }
.field small { color: var(--muted); }
.btn { border: 0; border-radius: 14px; padding: 13px 16px; font-weight: 800; background: var(--beet); color: #fff; }
.btn.ghost { background: var(--bg); color: var(--ink); border: 1.5px solid var(--line); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.note { font-size: .84rem; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; }
.note b { color: var(--ink); }
.install { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--ink); color: var(--bg); border-radius: 16px; padding: 12px 14px; }
.install button { border: 0; border-radius: 10px; background: var(--beet); color: #fff; padding: 8px 12px; font-weight: 800; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; }
.stat b { font-family: var(--display); font-size: 1.6rem; color: var(--beet); display: block; font-variant-numeric: tabular-nums; }
/* semana */
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.day { border: 1.5px solid var(--line); background: var(--surface); border-radius: 14px; padding: 8px 0 6px; display: grid; justify-items: center; gap: 0; font-weight: 800; font-size: .82rem; }
.day small { font-weight: 700; font-size: .66rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.day[aria-pressed="true"] { background: var(--beet); border-color: var(--beet); color: #fff; }
.day[aria-pressed="true"] small { color: #fff; opacity: .85; }
.meals { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.meal { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px; display: grid; grid-template-columns: 64px 1fr; gap: 12px; }
.meal time { font-weight: 800; color: var(--beet); font-variant-numeric: tabular-nums; line-height: 1.2; }
.meal time small { display: block; font-size: .72rem; color: var(--muted); font-weight: 700; margin-top: 2px; }
.meal .mb { min-width: 0; display: grid; gap: 4px; }
.meal b { font-family: var(--display); font-weight: 600; font-size: 1.05rem; line-height: 1.25; }
.meal small.m { color: var(--muted); font-size: .84rem; }
.mact { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.pill { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--line); background: var(--bg); border-radius: 999px; padding: 6px 12px; font-weight: 800; font-size: .84rem; }
.pill svg { width: 15px; height: 15px; }
.pill.main { background: var(--beet); border-color: var(--beet); color: #fff; }
.week { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.week > div { padding: 10px 14px; border-top: 1px solid var(--line); display: grid; gap: 2px; }
.week > div:first-child { border-top: 0; }
.week > div.today { background: var(--beet-soft); }
.week b { font-size: .9rem; }
.week span { font-size: .88rem; color: var(--muted); }
.week span i { font-style: normal; font-weight: 800; color: var(--ink); }
details.shop { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; }
details.shop summary { padding: 14px; font-family: var(--display); font-weight: 600; font-size: 1.1rem; cursor: pointer; }
details.shop .inner { padding: 0 14px 14px; display: grid; gap: 14px; }
details.shop h3 { font-size: .95rem; color: var(--beet); margin-bottom: 4px; }
details.shop .ings { border-radius: 14px; }
.todaylist { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.todaylist li { border-top: 1px solid var(--line); }
.todaylist li:first-child { border-top: 0; }
.todaylist button, .todaylist .static { width: 100%; text-align: left; border: 0; background: none; display: grid; grid-template-columns: 62px 1fr; gap: 10px; padding: 11px 14px; }
.todaylist time { font-weight: 800; color: var(--beet); font-variant-numeric: tabular-nums; }
.todaylist small { display: block; color: var(--muted); font-size: .78rem; }

/* tabela e marcações */
.progress { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; display: grid; gap: 8px; }
.progress b { font-variant-numeric: tabular-nums; }
.progress .bar { height: 10px; background: var(--line); border-radius: 999px; overflow: hidden; }
.progress .bar i { display: block; height: 100%; background: var(--ok); border-radius: 999px; transition: width .25s; }
.modebar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); }
.wtable { border-collapse: separate; border-spacing: 0; min-width: 100%; font-size: .86rem; }
.wtable th, .wtable td { border-bottom: 1px solid var(--line); padding: 9px 8px; vertical-align: top; text-align: left; }
.wtable thead th { background: var(--bg); font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); white-space: nowrap; }
.wtable thead th small { display: block; color: var(--beet); font-weight: 800; letter-spacing: 0; }
.wtable thead th:first-child { position: sticky; left: 0; z-index: 2; }
.wtable tbody th { position: sticky; left: 0; z-index: 1; background: var(--surface); min-width: 66px; font-weight: 800; border-right: 1px solid var(--line); }
.wtable tbody th small { display: block; color: var(--muted); font-weight: 700; font-size: .74rem; font-variant-numeric: tabular-nums; }
.wtable tr.today > * { background: var(--beet-soft); }
.wtable tbody tr:last-child > * { border-bottom: 0; }
.cell { display: flex; gap: 8px; align-items: flex-start; min-width: 140px; max-width: 170px; cursor: pointer; line-height: 1.3; }
.cell input { width: 20px; height: 20px; accent-color: var(--ok); flex: none; margin: 0; }
.cell input:checked + span { color: var(--muted); text-decoration: line-through; }
.cell em { display: block; font-style: normal; color: var(--no); font-weight: 800; font-size: .74rem; }
.meal.done b { text-decoration: line-through; color: var(--muted); }
.pill.ok[aria-pressed="true"] { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.nalert { font-size: .82rem; font-weight: 800; color: var(--no); }
.todaylist .ok { color: var(--ok); font-weight: 800; font-size: .78rem; }

/* anotações */
.notas { display: grid; gap: 10px; }
.nota { border-radius: 18px; padding: 14px; display: grid; gap: 6px; }
.nota.nao { background: var(--no-soft); }
.nota.gostou { background: var(--ok-soft); }
.nota.reacao { background: var(--warn-soft); }
.nota.obs { background: var(--beet-soft); }
.nota .tag { background: var(--surface); }
.nota header { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.nota header time { font-size: .8rem; color: var(--muted); font-weight: 700; }
.nota b { font-family: var(--display); font-weight: 600; font-size: 1.1rem; overflow-wrap: anywhere; }
.nota p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.nota .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 2px; }
.nota .pill { background: var(--surface); }
.pill.danger { background: var(--no); border-color: var(--no); color: #fff; }
.radios { display: flex; flex-wrap: wrap; gap: 8px; }
.radios label { position: relative; cursor: pointer; }
.radios input { position: absolute; opacity: 0; pointer-events: none; }
.radios label:has(input:checked) { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.radios label:has(input:focus-visible) { outline: 3px solid var(--beet); outline-offset: 2px; }
.field textarea { border: 1.5px solid var(--line); background: var(--bg); border-radius: 12px; padding: 11px 12px; width: 100%; resize: vertical; }
.modal .card { max-height: 92vh; overflow-y: auto; }
.err { color: var(--no); font-weight: 700; margin: 0; }
.addbtn { display: flex; align-items: center; justify-content: center; gap: 8px; }
.addbtn svg { width: 18px; height: 18px; }

/* livro */
.bookcover { background: var(--pumpkin-soft); border-radius: 22px; padding: 16px 18px; display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center; }
.bookcover h2 { font-size: 1.3rem; margin-top: 2px; }
.bookcover p { margin: 6px 0 0; font-size: .92rem; color: var(--muted); }
.bookstats { text-align: center; background: var(--surface); border-radius: 18px; padding: 10px 14px; }
.bookstats b { display: block; font-family: var(--display); font-size: 2rem; line-height: 1; color: var(--pumpkin); font-variant-numeric: tabular-nums; }
.bookstats small { font-weight: 800; font-size: .74rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }

/* contador e conquistas */
.counter { background: var(--surface); border: 1.5px solid var(--beet); border-radius: 24px; padding: 18px; display: grid; gap: 12px; }
.counter .big { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.counter .big b { font-family: var(--display); font-weight: 700; font-size: 3rem; line-height: 1; color: var(--beet); font-variant-numeric: tabular-nums; }
.counter .big span { font-weight: 800; }
.counter p { margin: 0; }
.counter .bar { height: 12px; background: var(--line); border-radius: 999px; overflow: hidden; }
.counter .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--pumpkin), var(--beet)); border-radius: 999px; }
.counter .row { display: flex; justify-content: space-between; gap: 10px; font-size: .88rem; font-weight: 700; color: var(--muted); flex-wrap: wrap; }
.trail { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.trail::-webkit-scrollbar { display: none; }
.trail span { flex: none; min-width: 46px; text-align: center; border-radius: 12px; padding: 6px 6px; font-size: .74rem; font-weight: 800; background: var(--bg); color: var(--muted); border: 1.5px solid var(--line); }
.trail span.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.trail span.now { background: var(--beet); color: #fff; border-color: var(--beet); }
.fmt { display: inline-flex; align-items: center; gap: 8px; background: var(--pumpkin-soft); color: var(--pumpkin); border-radius: 999px; padding: 6px 14px; font-family: var(--display); font-weight: 600; font-size: 1.05rem; justify-self: start; }
.ftable { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; font-size: .92rem; }
.ftable th, .ftable td { text-align: left; padding: 10px 12px; border-top: 1px solid var(--line); vertical-align: top; }
.ftable tr:first-child > * { border-top: 0; }
.ftable th { width: 38%; font-weight: 800; }
.ftable td.novo { color: var(--beet); font-weight: 700; }
.party { position: relative; min-height: 100%; display: grid; align-content: start; gap: 18px; padding-block: 24px 40px; text-align: left; }
.party canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
.party > *:not(canvas) { position: relative; z-index: 1; }
.party .yay { font-family: var(--display); font-weight: 700; font-size: 2.6rem; line-height: 1.05; color: var(--beet); margin: 0; }
.party .age2 { font-family: var(--display); font-weight: 600; font-size: 1.5rem; margin: 0; }
.party .badge { width: 120px; height: 120px; border-radius: 50%; background: var(--beet); color: #fff; display: grid; place-items: center; text-align: center; font-family: var(--display); font-weight: 700; font-size: 2.6rem; line-height: .9; box-shadow: 0 0 0 10px var(--beet-soft); }
.party .badge small { display: block; font-size: .8rem; font-family: var(--body); font-weight: 800; text-transform: uppercase; letter-spacing: .06em; }

/* passo a passo */
.cook { min-height: 100%; display: grid; grid-template-rows: auto auto 1fr auto; }
.cook .bar { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; }
.cook .bar i { display: block; height: 100%; background: var(--beet); border-radius: 999px; transition: width .25s; }
.cook .stage { display: grid; align-content: center; gap: 16px; padding-block: 24px; }
.cook .num { font-family: var(--display); font-weight: 700; color: var(--beet); font-size: 1rem; text-transform: uppercase; letter-spacing: .06em; }
.cook .big { font-size: 1.45rem; line-height: 1.45; font-weight: 700; margin: 0; }
.cook .nav2 { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
.cook .done { font-family: var(--display); font-size: 2rem; color: var(--beet); }
.startcook { display: flex; align-items: center; justify-content: center; gap: 8px; }
.startcook svg { width: 18px; height: 18px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
@media (max-width: 360px) { .rules { grid-template-columns: 1fr; } }

 p:["Misture todos os ingredientes até formar uma massa que dê para moldar.","Faça bolinhos achatados.","Asse a 200 °C por 25 minutos, virando na metade.","Espere amornar."],
 d:"Bom para levar em passeios."},
{n:"Peixe assado com purê de batata e ervilha",f:10,t:"almoco",tp:"30 min",r:"2 porções",
 i:["1 filé de tilápia ou merluza","2 batatas","3 colheres (sopa) de ervilha","Limão, azeite e salsinha"],
 p:["Tempere o peixe com gotas de limão, azeite e salsinha.","Asse em papel-manteiga a 200 °C por 15 a 18 minutos.","Cozinhe as batatas e amasse com azeite.","Cozinhe a ervilha e amasse levemente.","Desfie o peixe conferindo as espinhas com os dedos."],
 d:"Peixe 1 a 2 vezes por semana."},
{n:"Muffin salgado de legumes",f:10,t:"lanche",tp:"30 min",r:"8 muffins",
 i:["2 ovos","3 colheres (sopa) de aveia","1/2 cenoura ralada","1/2 abobrinha ralada","2 colheres (sopa) de ricota","1 colher (sopa) de azeite","1 colher (chá) de fermento químico"],
 p:["Misture os ovos, a ricota e o azeite.","Junte a aveia, os legumes e por último o fermento.","Distribua em forminhas de silicone untadas.","Asse a 180 °C por 20 minutos, até dourar."],
 d:"Corte em pedaços. Congela por até 1 mês."},
{n:"Frutas em tiras para pegar com a mão",f:10,t:"fruta",tp:"5 min",r:"1 porção",
 i:["Banana em tiras","Manga madura em tiras","Melancia sem sementes em palitos","Abacate em fatias","Uvas cortadas em 4 no comprimento"],
 p:["Lave bem as frutas.","Corte em tiras do tamanho de um dedo, macias.","Uvas e tomatinhos: sempre em 4 partes no comprimento.","Ofereça com ela sentada, sem distrações."],
 d:"Fruta é lanche, não sobremesa obrigatória."},
{n:"Picolé de fruta para a gengiva",f:10,t:"sobremesa",tp:"10 min + congelar",r:"6 picolés",
 i:["1 manga madura","1 banana","5 morangos"],
 p:["Bata as frutas no liquidificador, sem água e sem açúcar.","Distribua em forminhas de picolé pequenas.","Congele por pelo menos 4 horas.","Ofereça com ela sentada, para aliviar a coceira dos dentes nascendo."],
 d:"Aqui pode bater no liquidificador: é sobremesa gelada, não a papinha do dia."},
/* 11 meses */
{n:"Sopa grossa de legumes com frango e macarrão",f:11,t:"almoco",tp:"35 min",r:"4 porções",
 i:["100 g de frango em cubinhos","1 batata","1 cenoura","1/2 abobrinha","1/2 xícara de macarrão pequeno","Cebola, alho e salsinha","Azeite"],
 p:["Refogue a cebola, o alho e o frango no azeite.","Junte a batata e a cenoura em cubinhos e água para cobrir.","Cozinhe por 15 minutos e acrescente a abobrinha e o macarrão.","Cozinhe até tudo ficar macio e o caldo engrossar.","Sirva com pedaços, mais grossa do que rala."],
 d:"Sopa rala enche a barriga e alimenta pouco. Prefira grossa."},
{n:"Hambúrguer caseiro de frango",f:11,t:"almoco",tp:"25 min",r:"6 hambúrgueres",
 i:["250 g de frango moído","1/2 cenoura ralada","1 colher (sopa) de cebola ralada","2 colheres (sopa) de aveia","Cheiro-verde"],
 p:["Misture tudo com as mãos.","Modele hambúrgueres finos.","Doure em frigideira antiaderente com um fio de azeite, 5 minutos de cada lado, até cozinhar por dentro.","Corte em tiras."],
 d:"Congele crus, separados por papel-manteiga."},
{n:"Polenta mole com molho de carne",f:11,t:"almoco",tp:"30 min",r:"3 porções",
 i:["1/2 xícara de fubá","2 xícaras de água","150 g de carne moída","1 tomate","Cebola e azeite"],
 p:["Dissolva o fubá na água fria e leve ao fogo, mexendo sem parar, por 15 minutos.","Refogue a carne com cebola e tomate e um pouco de água até virar molho.","Sirva a polenta com o molho por cima.","Acompanhe com um legume cozido."],
 d:"Polenta firme e fria pode ser cortada em palitos para ela pegar."},
{n:"Panqueca de espinafre com frango",f:11,t:"almoco",tp:"30 min",r:"4 panquecas",
 i:["1 ovo","1/2 xícara de farinha de trigo","1/2 xícara de água","1 punhado de espinafre","Frango desfiado refogado com tomate"],
 p:["Bata o ovo, a farinha, a água e o espinafre no liquidificador.","Faça discos finos em frigideira antiaderente.","Recheie com o frango e enrole.","Corte em rodelas grossas."],
 d:"Massa sem leite e sem sal, ideal antes de 1 ano."},
{n:"Ovos mexidos com tomate e cuscuz",f:11,t:"cafe",tp:"15 min",r:"1 porção",
 i:["1 ovo","1/2 tomate sem sementes","3 colheres (sopa) de flocão de milho","Água e azeite"],
 p:["Hidrate o flocão com água e cozinhe no vapor (cuscuzeira) por 10 minutos.","Mexa o ovo com o tomate picadinho na frigideira até ficar bem firme.","Sirva junto com o cuscuz soltinho."],
 d:"Cuscuz de milho é ótimo café da manhã a partir dessa idade."},
{n:"Pera assada com canela",f:11,t:"sobremesa",tp:"25 min",r:"2 porções",
 i:["1 pera","1 pitada de canela"],
 p:["Corte a pera ao meio e retire as sementes.","Polvilhe canela.","Asse a 180 °C por 20 minutos, até ficar macia.","Sirva em pedaços mornos."],
 d:"Doce de verdade, sem açúcar."},
/* 1 ano */
{n:"Vitamina de banana",f:12,t:"bebida",tp:"3 min",r:"1 copo",
 i:["150 ml de leite integral","1/2 banana","1 colher (sopa) de aveia"],
 p:["Bata tudo no liquidificador.","Sirva no copo, sem açúcar.","Ofereça na hora para não escurecer."],
 d:"Conta como uma das porções de leite do dia."},
{n:"Suco natural de laranja",f:12,t:"bebida",tp:"5 min",r:"1 copo pequeno",
 i:["2 laranjas-lima ou pera","Água filtrada (opcional)"],
 p:["Lave as laranjas e esprema.","Se quiser, complete com um pouco de água.","Sirva na hora, sem açúcar, no copo.","Limite: até 120 ml por dia de 1 a 3 anos."],
 d:"A fruta inteira é sempre melhor que o suco, porque tem fibra."},
{n:"Água de coco natural",f:12,t:"bebida",tp:"2 min",r:"1 copo",
 i:["Água de coco verde (ou de garrafa, sem açúcar)"],
 p:["Sirva gelada ou natural, em copo.","Ofereça no máximo 1 copo pequeno (150 ml) por dia.","Não substitui a água do dia a dia."],
 d:"Boa para dias quentes e depois de brincar."},
{n:"Água saborizada com frutas",f:12,t:"bebida",tp:"5 min + 1 h",r:"500 ml",
 i:["500 ml de água filtrada","3 rodelas de laranja","3 morangos em fatias","Folhas de hortelã"],
 p:["Coloque as frutas e a hortelã na jarra com a água.","Leve à geladeira por 1 hora.","Coe ou retire os pedaços antes de servir para ela."],
 d:"Ajuda quem não quer beber água pura. Sem açúcar."},
{n:"Mingau de aveia com leite e canela",f:12,t:"cafe",tp:"6 min",r:"1 porção",
 i:["1 xícara de leite integral","2 colheres (sopa) de aveia","1/2 banana","Canela"],
 p:["Leve o leite e a aveia ao fogo, mexendo, por 4 minutos.","Desligue e misture a banana amassada.","Polvilhe canela e espere amornar."],
 d:"Adoçado só pela banana."},
{n:"Pão com ovo mexido e queijo",f:12,t:"cafe",tp:"8 min",r:"1 porção",
 i:["1 fatia de pão integral ou 1/2 pão francês","1 ovo","1 fatia de queijo branco ou muçarela"],
 p:["Mexa o ovo na frigideira até ficar bem firme.","Coloque sobre o pão com o queijo.","Corte em tiras ou quadradinhos."],
 d:"Queijos têm sal: uma fatia fina basta."},
{n:"Bolo de banana e aveia sem açúcar",f:12,t:"lanche",tp:"45 min",r:"12 fatias",
 i:["3 bananas maduras","2 ovos","1 xícara de aveia","1/4 xícara de óleo","1 colher (sopa) de fermento","Canela"],
 p:["Bata as bananas, os ovos e o óleo no liquidificador.","Misture a aveia e a canela e, por último, o fermento.","Despeje em forma untada.","Asse a 180 °C por 30 a 35 minutos."],
 d:"Quanto mais madura a banana, mais doce o bolo."},
{n:"Carne de panela com batata e cenoura",f:12,t:"almoco",tp:"50 min",r:"5 porções",
 i:["400 g de músculo ou acém em cubos","2 batatas","2 cenouras","1 tomate","Cebola, alho, louro","Sal, pouco"],
 p:["Doure a carne no azeite com cebola e alho.","Junte o tomate, o louro e água para cobrir.","Cozinhe na pressão por 25 minutos.","Junte batata e cenoura em cubos e cozinhe mais 10 minutos.","Desfie a carne para ela e sirva com arroz e feijão."],
 d:"Depois de 1 ano a comida pode ter sal, mas pouco: o mesmo da família, se a família usar pouco."},
{n:"Sopa de feijão com macarrão",f:12,t:"almoco",tp:"20 min",r:"3 porções",
 i:["2 xícaras de feijão cozido com caldo","1/2 xícara de macarrão pequeno","1 cenoura ralada","Couve picada","Cebola e alho"],
 p:["Refogue cebola e alho e junte o feijão com caldo.","Amasse parte dos grãos para engrossar.","Junte a cenoura e o macarrão e cozinhe até ficar macio.","Acrescente a couve no final."],
 d:"Jantar rápido com sobras de feijão."},
/* 1 ano e meio */
{n:"Strogonoff de frango com iogurte",f:18,t:"almoco",tp:"30 min",r:"4 porções",
 i:["300 g de frango em cubos","2 tomates","1/2 cebola","1 pote de iogurte natural integral (170 g)","1 colher (chá) de amido de milho","Cogumelos (opcional)"],
 p:["Refogue a cebola e o frango até dourar.","Junte os tomates picados e cozinhe até desmanchar.","Misture o iogurte com o amido e junte com o fogo baixo, mexendo, sem ferver.","Sirva com arroz e batata cozida."],
 d:"Versão sem creme de leite de caixinha e sem catchup."},
{n:"Purê de abóbora gratinado com carne",f:18,t:"almoco",tp:"40 min",r:"4 porções",
 i:["500 g de abóbora cabotiá","250 g de carne moída","1 tomate","Cebola e alho","3 colheres (sopa) de muçarela ralada"],
 p:["Cozinhe a abóbora e amasse.","Refogue a carne com cebola, alho e tomate.","Monte em refratário: carne embaixo, purê por cima.","Polvilhe a muçarela e gratine a 200 °C por 15 minutos."],
 d:"Fica bom com frango desfiado também."},
{n:"Biscoito de aveia e banana",f:18,t:"lanche",tp:"25 min",r:"15 biscoitos",
 i:["2 bananas maduras","1 xícara de aveia","Canela","Uva-passa picada (opcional)"],
 p:["Amasse as bananas e misture a aveia e a canela.","Faça bolinhas e achate na assadeira com papel-manteiga.","Asse a 180 °C por 15 a 18 minutos."],
 d:"Dois ingredientes principais e zero açúcar."},
{n:"Smoothie de morango com iogurte",f:18,t:"bebida",tp:"3 min",r:"1 copo",
 i:["1 pote de iogurte natural (170 g)","5 morangos","1/2 banana"],
 p:["Lave bem os morangos e retire as folhas.","Bata tudo no liquidificador.","Sirva no copo, sem açúcar."],
 d:"Congele a banana antes para ficar cremoso como sorvete."},
{n:"Suco de melancia com hortelã",f:18,t:"bebida",tp:"4 min",r:"2 copos pequenos",
 i:["2 fatias de melancia sem sementes","Folhas de hortelã","Gelo (opcional)"],
 p:["Bata a melancia com a hortelã.","Não precisa coar nem adoçar.","Sirva até 120 ml por dia."],
 d:"Refrescante para o verão."},
{n:"Torta de liquidificador de frango e legumes",f:18,t:"almoco",tp:"50 min",r:"8 pedaços",
 i:["2 ovos","1 xícara de leite","1/3 xícara de óleo","1 xícara de farinha de trigo","1 colher (sopa) de fermento","Recheio: frango desfiado, milho, ervilha, cenoura e tomate refogados","Sal, pouco"],
 p:["Bata ovos, leite, óleo e farinha no liquidificador.","Misture o fermento com uma colher.","Coloque metade da massa na forma, o recheio e o resto da massa.","Asse a 200 °C por 35 a 40 minutos."],
 d:"Milho e ervilha amassados ou cortados até os 2 anos."},
/* 2 anos */
{n:"Pizza de frigideira",f:24,t:"almoco",tp:"20 min",r:"1 pizza pequena",
 i:["1 ovo","3 colheres (sopa) de iogurte natural","4 colheres (sopa) de farinha de trigo integral","1 colher (chá) de fermento","Molho de tomate caseiro","Muçarela, tomate e orégano"],
 p:["Misture o ovo, o iogurte, a farinha e o fermento até virar massa mole.","Espalhe em frigideira antiaderente untada e tampe, em fogo baixo, por 5 minutos.","Vire, cubra com molho, queijo e tomate e tampe até derreter.","Corte em triângulos."],
 d:"Deixe ela escolher e colocar a cobertura."},
{n:"Nuggets de frango assados",f:24,t:"almoco",tp:"35 min",r:"20 nuggets",
 i:["400 g de peito de frango","1 ovo","1/2 cenoura ralada","Farinha de milho flocada ou farinha de rosca integral","Alho e pouco sal"],
 p:["Bata o frango no processador com alho, cenoura e uma pitada de sal.","Modele os nuggets.","Passe no ovo batido e depois na farinha.","Asse a 200 °C por 20 minutos, virando na metade."],
 d:"Muito mais saudável que o nugget pronto, que é ultraprocessado."},
{n:"Hambúrguer caseiro no pão",f:24,t:"almoco",tp:"25 min",r:"4 lanches",
 i:["300 g de carne moída","1/2 cebola ralada","1 cenoura ralada","4 pães de hambúrguer integrais","Alface, tomate e queijo"],
 p:["Misture a carne, a cebola, a cenoura e pouco sal.","Modele 4 hambúrgueres e grelhe até ficarem bem passados.","Monte com alface, tomate e queijo."],
 d:"Batata assada no forno no lugar da batata frita."},
{n:"Suco verde de couve, maçã e limão",f:24,t:"bebida",tp:"5 min",r:"2 copos pequenos",
 i:["1 folha de couve","1 maçã","Suco de 1/2 limão","1 copo de água","Hortelã"],
 p:["Lave bem a couve e a maçã.","Bata tudo no liquidificador.","Sirva sem coar e sem açúcar."],
 d:"Se achar azedo, junte meia banana ou um pedaço de abacaxi."},
{n:"Limonada suave com maçã",f:24,t:"bebida",tp:"5 min",r:"3 copos pequenos",
 i:["1 limão-taiti","1 maçã","500 ml de água gelada"],
 p:["Bata a maçã com a água.","Junte o suco do limão (não bata o limão com casca para não amargar).","Coe se preferir e sirva sem açúcar."],
 d:"A maçã adoça naturalmente."},
{n:"Bolo de cenoura com cobertura de cacau",f:24,t:"sobremesa",tp:"50 min",r:"12 fatias",
 i:["3 cenouras","3 ovos","1/2 xícara de óleo","1/2 xícara de açúcar mascavo","2 xícaras de farinha de trigo","1 colher (sopa) de fermento","Cobertura: 2 bananas maduras + 2 colheres (sopa) de cacau em pó 100%"],
 p:["Bata cenoura, ovos, óleo e açúcar no liquidificador.","Misture a farinha e, por último, o fermento.","Asse a 180 °C por 35 a 40 minutos.","Para a cobertura, amasse as bananas com o cacau e espalhe no bolo frio."],
 d:"Doce de festa e de fim de semana: pouco açúcar e de vez em quando."},
{n:"Picolé de iogurte com frutas",f:24,t:"sobremesa",tp:"10 min + congelar",r:"6 picolés",
 i:["2 potes de iogurte natural","1 xícara de frutas vermelhas ou manga","1 banana"],
 p:["Bata o iogurte com a banana.","Coloque pedacinhos de fruta nas forminhas.","Complete com o creme e congele por 6 horas."],
 d:"Troca boa para o sorvete industrializado."},
/* 3 anos */
{n:"Espaguete com almôndegas",f:36,t:"almoco",tp:"40 min",r:"4 porções",
 i:["250 g de espaguete","Almôndegas (300 g de carne, 1 ovo, aveia, cebola ralada)","Molho de tomate caseiro","Queijo ralado"],
 p:["Faça e asse as almôndegas a 200 °C por 20 minutos.","Aqueça o molho de tomate e junte as almôndegas.","Cozinhe o espaguete al dente e misture.","Sirva com queijo ralado por cima."],
 d:"Quebre o espaguete ao meio se ela tiver dificuldade."},
{n:"Wrap de frango com legumes",f:36,t:"lanche",tp:"15 min",r:"2 wraps",
 i:["2 discos de pão folha ou tortilha integral","Frango desfiado","Cenoura ralada","Alface picada","Requeijão caseiro ou iogurte natural"],
 p:["Espalhe uma camada fina de iogurte no pão.","Coloque frango, cenoura e alface.","Enrole bem apertado e corte ao meio."],
 d:"Ela pode montar o próprio wrap."},
{n:"Chocolate quente de cacau e banana",f:36,t:"bebida",tp:"6 min",r:"1 caneca",
 i:["1 xícara de leite","1 colher (sopa) de cacau em pó 100%","1/2 banana madura","Canela"],
 p:["Bata o leite, o cacau e a banana no liquidificador.","Aqueça em fogo baixo, mexendo, sem ferver.","Polvilhe canela e confira a temperatura antes de servir."],
 d:"Sem achocolatado: o cacau puro não tem açúcar."},
{n:"Coxinha de batata assada",f:36,t:"lanche",tp:"50 min",r:"12 coxinhas",
 i:["3 batatas cozidas e amassadas","1 xícara de farinha de trigo","Frango desfiado refogado com tomate","1 ovo batido","Farinha de rosca integral","Sal, pouco"],
 p:["Misture a batata com a farinha até a massa soltar das mãos.","Abra pequenas porções, recheie com o frango e modele as coxinhas.","Passe no ovo e na farinha de rosca.","Asse a 200 °C por 25 minutos, até dourar."],
 d:"Para festinhas sem fritura."},
{n:"Salada de frutas com iogurte e aveia",f:36,t:"sobremesa",tp:"10 min",r:"2 porções",
 i:["1 banana","1 maçã","1 fatia de mamão","Uvas cortadas ao meio","Suco de 1 laranja","Iogurte natural e aveia"],
 p:["Corte as frutas em cubinhos.","Regue com o suco de laranja.","Sirva com uma colher de iogurte e aveia por cima."],
 d:"Uvas ainda cortadas até os 4 anos."},
{n:"Panqueca americana integral",f:36,t:"cafe",tp:"20 min",r:"8 panquecas",
 i:["1 xícara de farinha integral","1 ovo","3/4 xícara de leite","1 banana amassada","1 colher (chá) de fermento","Frutas para servir"],
 p:["Misture ovo, leite e banana.","Junte a farinha e o fermento.","Doure colheradas em frigideira antiaderente, 2 minutos de cada lado.","Sirva com frutas picadas."],
 d:"Sem mel e sem calda: a fruta já adoça."},
{n:"Cookie de aveia com chocolate",f:36,t:"sobremesa",tp:"25 min",r:"15 cookies",
 i:["1 xícara de aveia","2 bananas maduras","2 colheres (sopa) de pasta de amendoim pura","2 colheres (sopa) de chocolate 70% picado"],
 p:["Amasse as bananas com a pasta de amendoim.","Misture a aveia e o chocolate.","Modele e asse a 180 °C por 15 minutos."],
 d:"Doce de vez em quando, sem açúcar refinado."},
/* 4 anos */
{n:"Pipoca de panela",f:48,t:"lanche",tp:"8 min",r:"1 tigela",
 i:["3 colheres (sopa) de milho de pipoca","1 colher (sopa) de óleo ou azeite","Pitada de sal ou orégano"],
 p:["Aqueça o óleo com o milho em panela tampada.","Quando começar a estourar, chacoalhe a panela.","Desligue quando os estouros espaçarem.","Tempere com pouco sal e sirva com ela sentada."],
 d:"Pipoca só a partir dos 4 anos, pelo risco de engasgo. A de micro-ondas é ultraprocessada."},
{n:"Sanduíche natural de atum",f:48,t:"lanche",tp:"10 min",r:"2 sanduíches",
 i:["4 fatias de pão integral","1 lata pequena de atum em água","2 colheres (sopa) de iogurte natural","Cenoura ralada","Alface"],
 p:["Escorra o atum e misture com o iogurte e a cenoura.","Recheie o pão com a pasta e a alface.","Corte em quadradinhos ou triângulos."],
 d:"Atum até 1 vez por semana (mercúrio)."},
{n:"Shake de banana com cacau",f:48,t:"bebida",tp:"3 min",r:"1 copo",
 i:["200 ml de leite gelado","1 banana congelada","1 colher (chá) de cacau 100%","1 colher (sopa) de aveia"],
 p:["Bata tudo no liquidificador até ficar cremoso.","Sirva na hora."],
 d:"Milk-shake sem sorvete e sem açúcar."},
{n:"Arroz de forno com frango e legumes",f:48,t:"almoco",tp:"40 min",r:"5 porções",
 i:["3 xícaras de arroz cozido","Frango desfiado","Cenoura, ervilha e milho","Molho de tomate caseiro","Muçarela ralada","1 ovo"],
 p:["Misture o arroz com o frango, os legumes, o molho e o ovo.","Coloque em refratário e cubra com queijo.","Asse a 200 °C por 20 minutos."],
 d:"Aproveita sobras de arroz do dia anterior."},
{n:"Espetinho de frutas com iogurte",f:48,t:"sobremesa",tp:"10 min",r:"4 espetinhos",
 i:["Morango, uva, banana, manga e kiwi","Palitos de churrasco sem ponta","Iogurte natural com canela"],
 p:["Corte as frutas em cubos.","Monte os espetinhos (corte a ponta do palito).","Sirva com iogurte para mergulhar.","Fique de olho: espeto só com ela sentada."],
 d:"Montar o espeto é uma ótima brincadeira na cozinha."},
{n:"Quibe de forno com abobrinha",f:48,t:"almoco",tp:"50 min",r:"8 pedaços",
 i:["1 xícara de trigo para quibe","400 g de carne moída","1 abobrinha ralada","1 cebola","Hortelã","Sal, pouco"],
 p:["Hidrate o trigo em água por 30 minutos e esprema.","Misture com a carne, a abobrinha, a cebola e a hortelã.","Espalhe em assadeira untada e corte em losangos.","Asse a 200 °C por 30 minutos."],
 d:"Sirva com salada de tomate e pepino."},
/* 5 a 6 anos */
{n:"Muffin de banana para a lancheira",f:60,t:"lanche",tp:"30 min",r:"10 muffins",
 i:["2 bananas","2 ovos","1 xícara de farinha integral","1/2 xícara de aveia","1/4 xícara de óleo","1 colher (sopa) de fermento","Canela"],
 p:["Bata bananas, ovos e óleo.","Misture as farinhas, a canela e o fermento.","Distribua em forminhas e asse a 180 °C por 20 minutos."],
 d:"Lancheira: muffin + fruta + garrafinha de água."},
{n:"Tacos de carne moída e feijão",f:60,t:"almoco",tp:"25 min",r:"6 tacos",
 i:["6 tortilhas pequenas","250 g de carne moída","1 xícara de feijão cozido","Tomate, alface e queijo ralado","Cominho e páprica doce"],
 p:["Refogue a carne com cominho e páprica.","Junte o feijão levemente amassado.","Aqueça as tortilhas.","Cada um monta o seu com tomate, alface e queijo."],

function doneKey(x) { return semanaKey() + "|" + x.key + "|" + x.r.n; }
function marcar(k) {
  var wk = semanaKey() + "|";
  Object.keys(feito).forEach(function (o) { if (o.indexOf(wk) !== 0) delete feito[o]; });
  if (feito[k]) delete feito[k]; else feito[k] = 1;
  save("feito", feito);
}
var NOTA_TIPOS = { nao: ["Não gostou", "no"], gostou: ["Gostou", "ok"], reacao: ["Reação ou alergia", "warn"], obs: ["Observação", "age"] };
function notasSobre(nome, tipos) {
  var n = norm(nome);
  return notas.filter(function (x) {
    if (tipos && tipos.indexOf(x.tipo) < 0) return false;
    var s = norm(x.sobre || "").trim(); if (s.length < 3) return false;
    return n.indexOf(s) >= 0 || s.indexOf(n) >= 0;
  });
}
function alertaNotas(nome) {
  var ns = notasSobre(nome, ["nao", "reacao"]); if (!ns.length) return "";
  var vistos = {}, partes = [];
  ns.forEach(function (x) { var t = (x.tipo === "nao" ? "Não gostou de " : "Reação a ") + x.sobre.trim(); if (!vistos[t]) { vistos[t] = 1; partes.push(esc(t)); } });
  return partes.join(" · ");
}
function dataBR(iso) { var p = (iso || "").split("-"); return p.length === 3 ? p[2] + "/" + p[1] + "/" + p[0] : ""; }
function hojeISO() { var d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }

function norm(s) { return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""); }
function load(k, d) { try { var v = localStorage.getItem("babyli:" + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function save(k, v) { try { localStorage.setItem("babyli:" + k, JSON.stringify(v)); } catch (e) {} }

var provou = load("provou", []);
var notas = load("notas", []);

var ui = { modoSemana: "dia", filtroNota: "todas", apagar: null, dia: null, fase: null, tipo: "todas", busca: "", grupo: "Todos", buscaA: "", verMeses: null, abertoA: null, abertaF: null };

function idadeMeses() {
  if (perfil.nasc) {
    var n = new Date(perfil.nasc + "T12:00:00"), h = new Date();
    if (!isNaN(n)) {
      var m = (h.getFullYear() - n.getFullYear()) * 12 + (h.getMonth() - n.getMonth());
      if (h.getDate() < n.getDate()) m--;
      return Math.max(0, m);
    }
  }
  return perfil.meses;
}
function faseDe(m) { var f = FASES[0]; for (var i = 0; i < FASES.length; i++) if (m >= FASES[i].de) f = FASES[i]; return f; }
function idadeTxt(m) {
  if (m < 12) return m + (m === 1 ? " mês" : " meses");
  var a = Math.floor(m / 12), r = m % 12;
  return a + (a === 1 ? " ano" : " anos") + (r ? " e " + r + (r === 1 ? " mês" : " meses") : "");
}
function aPartir(m) { return m < 12 ? m + " meses" : (m % 12 ? idadeTxt(m) : (m / 12) + (m === 12 ? " ano" : " anos")); }
function nomeBebe() { return perfil.nome ? esc(perfil.nome) : "sua bebê"; }
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
RECEITAS.forEach(function (r, i) { r.id = "r" + i; });
if (typeof LIVRO !== "undefined") { LIVRO.forEach(function (r) { r.id = "L-" + norm(r.n).replace(/[^a-z0-9]+/g, "-"); }); RECEITAS = RECEITAS.concat(LIVRO); }

  { id: "m8", de: 8, curto: "8m", nome: "8 meses" }, { id: "m9", de: 9, curto: "9m", nome: "9 meses" },
  { id: "m10", de: 10, curto: "10m", nome: "10 meses" }, { id: "m11", de: 11, curto: "11m", nome: "11 meses" },
  { id: "b1", de: 12, curto: "1 a 2 anos", nome: "1 a 2 anos", titulo: "Comida da família", fmt: ["Comida da família picada", "Comida da casa em pedaços pequenos, com pouco sal. Sem açúcar e sem mel até os 2 anos."] },
  { id: "b2", de: 24, curto: "2 a 3 anos", nome: "2 a 3 anos", titulo: "Pequena cozinheira", fmt: ["Quase tudo inteiro", "Comida da família. Uva, tomate-cereja e salsicha ainda cortados no comprimento."] },
  { id: "b3", de: 36, curto: "3 a 4 anos", nome: "3 a 4 anos", titulo: "Autonomia", fmt: ["Quase tudo inteiro", "Comida da família. Uva e tomate-cereja ainda cortados até os 4 anos."] },
  { id: "b4", de: 48, curto: "4 a 5 anos", nome: "4 a 5 anos", titulo: "Escola e lancheira", fmt: ["Inteiro", "Uva inteira e pipoca liberadas, sempre sentada. Castanhas inteiras só a partir dos 5 anos."] }
];
function faseLivro(m) { var f = LIVRO_FASES[0]; LIVRO_FASES.forEach(function (x) { if (m >= x.de) f = x; }); return f; }

function status(a, m) {
  var desde = a[2], ate = a[3];
  if (desde >= 999) return { k: "no", t: "Evitar" };
  if (m < desde) return { k: "no", t: "Ainda não", sub: "a partir de " + aPartir(desde) };
  if (ate >= 999) return { k: "warn", t: "Com moderação" };
  if (m < ate) return { k: "warn", t: "Com cuidado", sub: "atenção até " + aPartir(ate) };
  return { k: "ok", t: "Pode" };
}

function cardContador() {
  var c = contador();
  if (!c) return '<section class="counter"><span class="eyebrow">Contador da introdução alimentar</span><h2 style="font-size:1.3rem">Conte cada dia desde os 6 meses</h2><p class="muted">Coloque a data de nascimento de ' + nomeBebe() + ' e o app conta os dias, mostra quanto falta para o próximo mês e dá os parabéns a cada conquista.</p><button class="btn" type="button" id="ageBtn2">Colocar data de nascimento</button></section>';
  var trilha = MARCOS.filter(function (x) { return x <= 12 || x <= (c.prox || 72); }).map(function (x) {
    var k = x < c.m && x !== marcoAtual(c.m) ? "ok" : x === marcoAtual(c.m) ? "now" : "";
    return '<span class="' + k + '">' + (x < 12 ? x + "m" : x === 18 ? "1a½" : (x / 12) + "a") + '</span>';
  }).join("");
  var h = '<section class="counter" aria-label="Contador">';

  } else {
    h += '<span class="eyebrow">Introdução alimentar</span><div class="big"><b>Dia ' + c.dias + '</b><span>comendo comidinhas</span></div>' +
      '<p class="muted">' + nomeBebe().charAt(0).toUpperCase() + nomeBebe().slice(1) + ' tem ' + idadeTxt(c.m) + (c.diasNoMes ? ' e ' + c.diasNoMes + (c.diasNoMes === 1 ? ' dia' : ' dias') : '') + '. Começou a comer em ' + fmtData(c.inicio) + '.</p>';
    if (c.prox) h += '<div class="bar" aria-hidden="true"><i style="width:' + c.pct + '%"></i></div><div class="row"><span>' + marcoNome(marcoAtual(c.m)) + '</span><span>' + (c.faltam === 0 ? 'É hoje!' : 'Faltam ' + c.faltam + (c.faltam === 1 ? ' dia' : ' dias') + ' para ' + marcoNome(c.prox)) + '</span></div>';

function festa(x) {

  var f = faseDe(x), fm = FORMATO[f.id];

    (c && c.dias > 1 && x > 6 ? '<p class="muted" style="margin:0">Já são ' + diasEntre(c.inicio, addMeses(n, x)) + ' dias de introdução alimentar. Que conquista!</p>' : '') +
    '<section class="block"><h2>Como ela come agora</h2><span class="fmt">' + fm[0] + '</span><p style="margin:0">' + fm[1] + '</p>' +
    (x <= 12 && typeof IL !== "undefined" ? cortesHTML(IL.CORTE, x, ant) : '') +
    '<table class="ftable"><tbody>' + COMO_SERVIR.map(function (row) {

      return '<tr><th>' + row[0] + '</th><td' + (nv ? ' class="novo"' : '') + '>' + servirEm(row, x).txt + (nv ? ' <span class="tag age">novo</span>' : '') + '</td></tr>';
    }).join("") + '</tbody></table></section>' +

    (alim.length ? '<section class="block"><h2>Novos alimentos liberados</h2><div class="chips" style="flex-wrap:wrap">' + alim.map(function (a) { return '<span class="chip">' + a[0] + '</span>'; }).join("") + '</div></section>' : '') +

  sheet.innerHTML = h; sheet.hidden = false; sheet.scrollTop = 0; document.body.style.overflow = "hidden";

function confete() {
  var cv = document.getElementById("confete"); if (!cv) return;
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var ctx = cv.getContext("2d"), W = cv.width = innerWidth, H = cv.height = innerHeight;
  var cs = getComputedStyle(document.documentElement), cores = ["--beet", "--pumpkin", "--ok", "--warn"].map(function (v) { return cs.getPropertyValue(v).trim() || "#b03a6f"; });
  var ps = []; for (var i = 0; i < 140; i++) ps.push({ x: Math.random() * W, y: -Math.random() * H, w: 6 + Math.random() * 6, h: 8 + Math.random() * 8, vy: 2 + Math.random() * 3, vx: -1 + Math.random() * 2, r: Math.random() * 6, vr: -.1 + Math.random() * .2, c: cores[i % cores.length] });
  var t0 = performance.now();
  (function loop(t) {
    if (!document.getElementById("confete")) return;
    ctx.clearRect(0, 0, W, H);
    var vivo = t - t0 < 4500;
    ps.forEach(function (p) { p.y += p.vy; p.x += p.vx; p.r += p.vr; if (p.y > H && vivo) { p.y = -10; p.x = Math.random() * W; }
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore(); });
    if (vivo || ps.some(function (p) { return p.y < H; })) requestAnimationFrame(loop); else ctx.clearRect(0, 0, W, H);
  })(t0);
}
function checarFesta() {

document.addEventListener("click", function (e) {
  var t = e.target.closest("button, [data-cancel]"); if (!t) { if (e.target === modal) modal.hidden = true; return; }
  var d = t.dataset;
  if (d.tab) return go(d.tab);
  if (d.go) return go(d.go);
  if (d.rec) return openRec(d.rec);
  if (d.close !== undefined) return closeRec();
  if (d.fav) {
    var i = favs.indexOf(d.fav); if (i >= 0) favs.splice(i, 1); else favs.push(d.fav);
    save("favs", favs); var y = sheet.scrollTop; openRec(d.fav); sheet.scrollTop = y; return;
  }
  if (d.fase) { ui.fase = d.fase; ui.busca = ""; return render(); }

  if (d.tried) {
    var j = provou.indexOf(d.tried); if (j >= 0) provou.splice(j, 1); else provou.push(d.tried);
    save("provou", provou); return render();
  }
  if (d.fasebox) { ui.abertaF = ui.abertaF === d.fasebox ? "" : d.fasebox; return render(); }
  if (d.verfase && !sheet.hidden) { sheet.hidden = true; sheet.innerHTML = ""; document.body.style.overflow = ""; }
  if (d.verfase) { var fx = FASES.filter(function (x) { return x.id === d.verfase; })[0]; ui.fase = fx ? faseLivro(fx.de).id : d.verfase; ui.tipo = "todas"; ui.busca = ""; return go("receitas"); }

  if (d.modo) { ui.modoSemana = d.modo; return render(); }
  if (d.donebtn) { marcar(d.donebtn); return keepRender(); }
  if (d.anotar) return openNota(null, d.anotar);

  if (d.dia) { ui.dia = parseInt(d.dia, 10); return render(); }
  if (d.troca) {
    var ps = planoState(); ps.st.trocas[d.troca] = (ps.st.trocas[d.troca] || 0) + 1; ps.all[ps.id] = ps.st; save("plano", ps.all); return render();
  }
  if (d.novasemana !== undefined) {

  }
  if (t.id === "ageBtn" || t.id === "ageBtn2") return openPerfil();
  if (t.id === "installBtn") return doInstall();
});
document.addEventListener("change", function (e) {
  if (e.target.id === "fotoIn" && e.target.files && e.target.files[0]) {
    var id = e.target.dataset.fotoid, rd = new FileReader();

        var k = Math.min(1, 640 / Math.max(im.width, im.height)), cv = document.createElement("canvas");
        cv.width = Math.round(im.width * k); cv.height = Math.round(im.height * k);
